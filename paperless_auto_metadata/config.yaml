name: Paperless Auto Metadata
version: "1.5.1"
slug: paperless_auto_metadata
description: Configurable OCR regex rules and custom field mapping for Paperless-ngx
url: https://github.com/immortalserg/ha-apps
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-edit-outline
panel_title: Paperless Metadata
options:
  paperless_url: ""
  api_token: ""
  poll_seconds: 30
  scan_documents: 100
  dry_run: true
schema:
  paperless_url: url
  api_token: password
  poll_seconds: int(10,3600)
  scan_documents: int(1,1000)
  dry_run: bool
