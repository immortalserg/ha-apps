name: Sync FinWorkspace add-on
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finworkspace-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout upstream add-on
        uses: actions/checkout@v4
        with:
          repository: immortalserg/FinWorkspace-HA
          ref: main
          path: _upstream_finworkspace
          persist-credentials: false
      - name: Update FinWorkspace folder
        run: |
          test -f _upstream_finworkspace/finworkspace/config.yaml
          mkdir -p finworkspace
          rsync -a --delete _upstream_finworkspace/finworkspace/ finworkspace/
          rm -rf _upstream_finworkspace
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A finworkspace
          if git diff --cached --quiet; then
            echo 'No FinWorkspace changes.'
          else
            git commit -m "chore: sync FinWorkspace add-on from FinWorkspace-HA"
            git push
          fi
