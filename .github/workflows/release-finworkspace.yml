name: Release FinWorkspace Home Assistant image

on:
  push:
    tags:
      - "finworkspace-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'FinWorkspace Home Assistant add-on version, e.g. 1.1.7'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout add-on catalog
        uses: actions/checkout@v4
      - name: Validate add-on version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#finworkspace-v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid add-on version: ${VERSION}"
            exit 1
          fi
          if ! grep -Fxq "version: \"${VERSION}\"" finworkspace/config.yaml; then
            echo "Version ${VERSION} does not match finworkspace/config.yaml"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./finworkspace
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finworkspace-ha:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/finworkspace-ha:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=FinWorkspace for Home Assistant
